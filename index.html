<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة عبء العمل</title>
<!-- الخط المحلي (يعمل دون إنترنت) -->
<link rel="stylesheet" href="apps/sections/css/fonts.css">
<style>
  :root {
    --primary: #1b5e4b;
    --primary-dark: #123f33;
    --primary-soft: #e8f1ed;
    --gold: #b08d3c;
    --gold-soft: #f6efdf;
    --bg: #f4f6f5;
    --surface: #ffffff;
    --border: #d9e3df;
    --text: #1f2937;
    --muted: #5b6770;
    --bar-h: 58px;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.14);
    --font: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* الشريط العلوي */
  .bar {
    position: fixed; inset: 0 0 auto 0; height: var(--bar-h); z-index: 10;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: var(--primary-dark); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; background: none; border: 0; color: #fff; padding: 6px 4px; }
  .brand svg { width: 24px; height: 24px; color: var(--gold); }
  .tabs { display: none; gap: 4px; margin-inline-start: 12px; overflow-x: auto; }
  body.in-app .tabs { display: flex; }
  .tab {
    border: 0; background: transparent; color: rgba(255,255,255,.75);
    padding: 7px 14px; border-radius: 8px; font-weight: 500; white-space: nowrap;
  }
  .tab:hover { background: rgba(255,255,255,.08); color: #fff; }
  .tab[aria-selected="true"] { background: #fff; color: var(--primary-dark); font-weight: 700; }
  .spacer { flex: 1; }
  .home-btn { display: none; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  body.in-app .home-btn { display: inline-block; }
  .home-btn:hover { background: rgba(255,255,255,.1); }

  /* الصفحة الرئيسية */
  .home { padding: calc(var(--bar-h) + 40px) 16px 48px; max-width: 1100px; margin: 0 auto; }
  body.in-app .home { display: none; }
  .home h1 { font-size: 30px; font-weight: 800; margin: 0 0 6px; color: var(--primary-dark); }
  .home .lead { color: var(--muted); margin: 0 0 32px; font-size: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .card {
    text-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary); outline: none; }
  .card .icon { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .card .icon svg { width: 26px; height: 26px; }
  .card h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
  .card ul { margin: 0; padding-inline-start: 18px; color: var(--text); font-size: 14px; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .tag.gold { background: var(--gold-soft); color: #7a5c17; }
  .card .go { margin-top: 6px; font-weight: 700; color: var(--primary); }
  .note { margin-top: 28px; font-size: 13.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px 16px; }

  /* إطارات الخدمات: تبقى محمّلة عند التنقل حتى لا تضيع البيانات */
  .frames { position: fixed; inset: var(--bar-h) 0 0 0; display: none; }
  body.in-app .frames { display: block; }
  .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; }
  .frames iframe.active { visibility: visible; }

  @media (max-width: 640px) {
    .brand span { display: none; }
    .home h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header class="bar">
  <button class="brand" id="brand" title="الصفحة الرئيسية">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>منصة عبء العمل</span>
  </button>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="spacer"></div>
  <button class="home-btn" id="homeBtn">جميع الخدمات</button>
</header>

<main class="home">
  <h1>منصة عبء العمل</h1>
  <p class="lead">اختر الخدمة التي تريد استخدامها. يمكنك التنقل بين الخدمات من الشريط العلوي دون أن تفقد عملك.</p>
  <div class="cards" id="cards"></div>
  <div class="note">
    كل خدمة تعمل باستقلال كامل، ولكل منها حفظ وتصدير خاص. جميع الخدمات تعمل داخل المتصفح، ولا تُرسل بياناتك إلى أي خادم إلا عند تفعيل المساعد الذكي بمفتاحك الخاص.
  </div>
</main>

<div class="frames" id="frames"></div>

<script>
(function () {
  'use strict';

  var SERVICES = [
    {
      id: 'analysis',
      title: 'تحليل عبء العمل',
      tag: 'الإصدار 1', gold: false,
      src: 'apps/analysis/index.html',
      desc: 'أدخل المهام الفعلية للجهة، فيُحسب الاحتياج الوظيفي والفجوة لكل مسمى فعلي.',
      points: ['لصق المهام من Excel أو Word', 'مساعد ذكي لتحسين صياغة المهام', 'تصدير Excel بمعادلات حية'],
      icon: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    },
    {
      id: 'sections',
      title: 'تحليل عبء العمل حسب الأقسام',
      tag: 'الإصدار 2', gold: false,
      src: 'apps/sections/index.html',
      desc: 'كالخدمة السابقة، مع تعريف الأقسام والوحدات وحساب الاحتياج لكل قسم × مسمى فعلي.',
      points: ['قائمة أقسام تُختار لكل مهمة', 'احتياج مجمّع حسب القسم والمسمى', 'يفتح ملفات مشاريع الإصدار 1'],
      icon: '<rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>'
    },
    {
      id: 'engine',
      title: 'محرك نماذج عبء العمل',
      tag: 'توليد عكسي', gold: true,
      src: 'apps/engine/index.html',
      desc: 'أدخل عدد الموظفين المستهدف، فيولّد نموذج مهام افتراضيًا متوازنًا يقارب ساعاته العدد × 1023.',
      points: ['240 سيناريو ويُختار أعلاها جودة', 'تقييم جودة النموذج', 'تصدير Excel جاهز للتعبئة'],
      icon: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="currentColor"/>'
    }
  ];

  var cards = document.getElementById('cards');
  var tabs = document.getElementById('tabs');
  var frames = document.getElementById('frames');
  var loaded = {};

  SERVICES.forEach(function (s) {
    var card = document.createElement('button');
    card.className = 'card';
    card.innerHTML =
      '<div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">' + s.icon + '</svg></div>' +
      '<span class="tag' + (s.gold ? ' gold' : '') + '">' + s.tag + '</span>' +
      '<h2>' + s.title + '</h2><p>' + s.desc + '</p>' +
      '<ul>' + s.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
      '<span class="go">فتح الخدمة ←</span>';
    card.addEventListener('click', function () { location.hash = s.id; });
    cards.appendChild(card);

    var tab = document.createElement('button');
    tab.className = 'tab';
    tab.setAttribute('role', 'tab');
    tab.dataset.id = s.id;
    tab.textContent = s.title;
    tab.addEventListener('click', function () { location.hash = s.id; });
    tabs.appendChild(tab);
  });

  function frameFor(s) {
    if (!loaded[s.id]) {
      var f = document.createElement('iframe');
      f.title = s.title;
      f.src = s.src;
      f.dataset.id = s.id;
      frames.appendChild(f);
      loaded[s.id] = f;
    }
    return loaded[s.id];
  }

  function show() {
    var id = location.hash.slice(1);
    var s = SERVICES.filter(function (x) { return x.id === id; })[0];
    document.body.classList.toggle('in-app', !!s);
    document.title = s ? s.title + ' — منصة عبء العمل' : 'منصة عبء العمل';
    Array.prototype.forEach.call(tabs.children, function (t) {
      t.setAttribute('aria-selected', s && t.dataset.id === s.id ? 'true' : 'false');
    });
    if (!s) return;
    var active = frameFor(s);
    Array.prototype.forEach.call(frames.children, function (f) {
      f.classList.toggle('active', f === active);
    });
  }

  function goHome() { history.pushState(null, '', location.pathname); show(); }
  document.getElementById('brand').addEventListener('click', goHome);
  document.getElementById('homeBtn').addEventListener('click', goHome);
  window.addEventListener('hashchange', show);

  // تنبيه قبل الإغلاق إذا فُتحت خدمة (قد تحتوي بيانات غير محفوظة)
  window.addEventListener('beforeunload', function (e) {
    if (Object.keys(loaded).length) { e.preventDefault(); e.returnValue = ''; }
  });

  show();
})();
</script>
</body>
</html>
